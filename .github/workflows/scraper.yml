name: Zoopla Scraper

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 'python-3.14.0-beta.3-linux-22.04-arm64-freethreaded.tar.gz'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scraper
      run: |
        mkdir -p output
        python zoopla_scraper.py

    - name: Upload output CSV
      uses: actions/upload-artifact@v4
      with:
        name: scraped-results
        path: output/
