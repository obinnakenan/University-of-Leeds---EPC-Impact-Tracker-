name: Zoopla Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install system dependencies for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libxss1 \
            libappindicator3-1 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libgbm-dev \
            libasound2t64

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          mkdir -p output
          python zoopla_scraper.py

      - name: Upload scraped data
        uses: actions/upload-artifact@v4
        with:
          name: scraped-results
          path: output/
